version=0.0.7
group=ch.qligier.jetbrains.plugin.fss
pluginRepositoryUrl=https://github.com/qligier/jetbrains-plugin-fss
# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# Gradle daemon JVM arguments. The default (-Xmx512m -XX:MaxMetaspaceSize=384m) is too small for the IntelliJ Platform
# Gradle Plugin, which resolves and inspects the whole IDE distribution inside the daemon (e.g. dumpBundledPlugins).
# The Kotlin daemon inherits these values.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
